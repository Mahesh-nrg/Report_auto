[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwndoc-ai"
version = "0.1.0"
description = "AI report assistant for PwnDoc: an 'Update with AI' button and LLM settings injected into the stock PwnDoc UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "websockets>=13",
  "openai>=1.30",
  "python-multipart>=0.0.9",
  "ddgs>=9",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Local document RAG (uses ChromaDB's built-in ONNX embedder, no PyTorch needed).
rag = ["chromadb>=0.5", "pypdf>=5.1", "python-docx>=1"]
# Refine an uploaded Word report in place (lxml is installed together with python-docx);
# pypdf post-processes the PDF download (blank pages, table-of-contents numbers).
docx = ["python-docx>=1", "pypdf>=5.1"]
# PDF download of reports: blank-page removal and TOC page numbers (LibreOffice itself is a
# system package; fonts-crosextra-carlito and fonts-crosextra-caladea keep Word's line breaks).
pdf = ["python-docx>=1", "pypdf>=5.1"]
# Optional second PDF -> DOCX engine of the Export tab (layout-faithful, run in an isolated worker
# process only). LICENCE: PyMuPDF is AGPL-3.0 (or an Artifex commercial licence); installing this
# extra makes the deployment subject to the AGPL terms. pymupdf 2.x needs Python 3.11 or newer.
# The default "structure" engine needs only the docx extra plus mutool and pdftotext.
pdfimport = ["pdf2docx==0.5.13", "pymupdf>=1.26.7,<2", "python-docx>=1", "pypdf>=5.1"]
# Serve the gateway over HTTPS with an auto-generated self-signed certificate.
https = ["cryptography>=42"]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.23", "ruff>=0.4"]
# Browser tests (tests/e2e, tests/ui); also needs a Chromium binary, see the README.
ui = ["playwright>=1.40"]

[project.scripts]
pwndoc-ai = "pwndoc_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pwndoc_ai = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
